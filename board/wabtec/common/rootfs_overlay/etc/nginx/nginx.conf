# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/
#   * Official Russian Documentation: http://nginx.org/ru/docs/

# Let nginx daemonize itself
#daemon off;

#user www-data;
worker_processes 6;

# Hardware crypto acceleration (ColdFire CAU)
# Note: OpenSSL 3.x uses providers/engines automatically when available.
# The devcrypto engine is loaded automatically - no ssl_engine directive needed.
# Requires cryptodev kernel module to be loaded.
# ssl_engine devcrypto;  # Deprecated in OpenSSL 3.x
error_log /var/log/nginx/error.log debug;
pid /var/run/nginx.pid;

# Load dynamic modules. See /usr/share/nginx/README.dynamic.
# include /usr/share/nginx/modules/*.conf; No dynamic modules in WebMonExt nor WebServices

events {
    worker_connections 6;
}

http {
    log_format  main  '[$time_local]($remote_addr) "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

#    access_log      off;
    access_log  /tmp/nginx/access.log  main;
    error_log       syslog:server=unix:/dev/log,tag=nginx,nohostname,severity=error;

    # Remove nginx version from header and error page
    server_tokens   off;

    client_max_body_size 30m;

    sendfile on;
    sendfile_max_chunk  0;
    tcp_nopush          on;
    tcp_nodelay         on;
    proxy_read_timeout  30;
    types_hash_max_size 2048;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # Load modular configuration files from the /etc/nginx/conf.d directory.
    # See http://nginx.org/en/docs/ngx_core_module.html#include
    # for more information.
    # include /etc/nginx/conf.d/*.conf; No modular configuration files in WebMonExt nor WebServices
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }


    # WebSocketFy
    #
    upstream websocket {
        server 127.0.0.1:3000;
    }

    # HTTP server
    #
    server {
            listen       8080 default;
            server_name  WebMonext;

        # include WebService HTTP locations
        # Above line shall be uncommented when WebService is integrated
        # include /usr/WebServers/WebService/nginx/nginx80.location;

        ## Redirige le HTTP vers le HTTPS ##
        location / {
            return 301 https://$http_host$request_uri;
        }
    }

    # HTTP server
    #
    server {
        listen      8443 ssl;           #Ecouter en IPV4
        server_name WebMonext;
        root        /usr/html/;
        index       index.html;

        # include WebMonExt HTTPS locations
        # Above line shall be uncommented when WebMonExt is integrated
        # include /usr/WebServers/WebMonExt/nginx/nginx443.location;

        # include WebService HTTPS locations
        # Above line shall be uncommented when WebService is integrated
        # include /usr/WebServers/WebService/nginx/nginx443.location;

        error_page 404 /404.html;
            location = /40x.html {
        }

        error_page 500 502 503 504 /50x.html;
            location = /50x.html {
        }

        ###########
        #   SSL   #
        ###########
        ## Certificates - Choose ECC or RSA
        ## ECC (P-256) - FASTEST on ColdFire (~1.6s handshake with OpenSSL+cryptodev)
        ssl_certificate     /etc/ssl/certificate/WebMonext_ECC.crt;
        ssl_certificate_key /etc/ssl/private/WebMonext_ECC.key;
        ## RSA (2048-bit) - Slower
        #ssl_certificate     /etc/ssl/certificate/WebMonext_RSA.crt;
        #ssl_certificate_key /etc/ssl/private/WebMonext_RSA.key;

        ## Protocol - TLSv1.3 works correctly on ColdFire
        ## Note: TLSv1.2 cipher tables have corruption issues on m68k/ColdFire
        ## Using TLSv1.3 only as workaround until root cause is fixed
        ssl_protocols           TLSv1.3;
        ## Alternative: Enable both (TLS 1.3 preferred, TLS 1.2 fallback)
        #ssl_protocols           TLSv1.3 TLSv1.2;

        ## Diffie-Hellman - DISABLED (ECDHE is faster on ColdFire)
        ## ECDHE provides forward secrecy without the slow DH computation
        #ssl_dhparam             /etc/ssl/certificate/dhparam2048.pem;

        ## ANSSI R7-Key exchanges: prime256v1 (P-256), secp384r1, or secp521r1
        ## Note: P-256 (~5 ops/s) is faster than P-384 (~1.8 ops/s) on MCF54418
        ## OpenSSL 3.x uses "prime256v1" or "P-256" instead of "secp256r1"
        ssl_ecdh_curve          prime256v1;

        ## Ciphers - Server chooses the best cipher
        ssl_prefer_server_ciphers  on;

        ############################################################################
        # TLS 1.3 CIPHERSUITES (these work correctly on ColdFire)
        # TLS 1.3 uses different cipher configuration than TLS 1.2
        # Available: TLS_AES_256_GCM_SHA384, TLS_AES_128_GCM_SHA256,
        #            TLS_CHACHA20_POLY1305_SHA256, TLS_AES_128_CCM_SHA256
        ############################################################################
        # ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256;

        ############################################################################
        # CIPHER CONFIGURATION OPTIONS
        # Choose ONE of the following ssl_ciphers lines based on your requirements:
        ############################################################################

        ## OPTION 1: SECURITY MODE (ANSSI/TLS 1.2 compliant)
        ## Uses AES-GCM which is NOT hardware accelerated (slow: ~200-550ms/handshake)
        ## Compliant with ALSTOM STD0017 rev F / ANSSI recommendations
        ## Recommended for: Internet-facing services, compliance requirements
        #ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:!aNULL:!eNULL:!EXPORT:!DES:!MD5:!PSK:!RC4;

        ## OPTION 2: PERFORMANCE MODE (CAU Hardware Accelerated)
        ## Uses AES-CBC + SHA1 which IS hardware accelerated via CAU
        ## Much faster handshakes but uses SHA1 (deprecated for new deployments)
        ## Recommended for: Internal/isolated networks, performance-critical
        #ssl_ciphers ECDHE-ECDSA-AES256-SHA:ECDHE-ECDSA-AES128-SHA:ECDHE-RSA-AES256-SHA:ECDHE-RSA-AES128-SHA:!aNULL:!eNULL:!EXPORT:!DES:!MD5:!PSK:!RC4;

        ## OPTION 3: HYBRID MODE (DISABLED - TLS 1.2 cipher tables corrupted on ColdFire)
        ## Prioritizes GCM ciphers but allows CBC fallback
        ## Provides security compliance while allowing hardware acceleration if client supports CBC
        ## NOTE: Commented out because TLS 1.2 cipher lookup is broken, using TLS 1.3 only
        #ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-SHA384:ECDHE-ECDSA-AES256-SHA:ECDHE-RSA-AES256-SHA:!aNULL:!eNULL:!EXPORT:!DES:!MD5:!PSK:!RC4;

        ## OPTION 4: RSA TEST MODE (for comparing RSA vs ECC performance)
        ## Uses RSA certificate - tests RSA key exchange performance
        #ssl_ciphers ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA:ECDHE-RSA-AES128-SHA:AES256-GCM-SHA384:AES128-GCM-SHA256:AES256-SHA:AES128-SHA:!aNULL:!eNULL:!EXPORT:!DES:!MD5:!PSK:!RC4;

        ############################################################################
        # MCF54418 CAU Hardware Capabilities:
        # - AES (CBC mode only) - ACCELERATED
        # - DES                 - ACCELERATED
        # - SHA1                - ACCELERATED
        # - SHA256              - ACCELERATED
        # - MD5                 - ACCELERATED
        # - AES-GCM             - NOT accelerated (software only)
        # - 3DES                - NOT supported by CAU
        # - SHA-224/384/512     - NOT accelerated (software only)
        ############################################################################

        ## TLS parameters
        ssl_session_cache    shared:SSL:20m;
        ssl_session_timeout  180m;
        ssl_session_tickets on;

        ## HSTS
        add_header Strict-Transport-Security "max-age=15768000; includeSubDomains";
    }

}
