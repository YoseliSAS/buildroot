# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/
#   * Official Russian Documentation: http://nginx.org/ru/docs/

#user www-data;
worker_processes 6;
error_log /tmp/nginx/error.log debug;
pid /tmp/nginx.pid;

# Load dynamic modules. See /usr/share/nginx/README.dynamic.
# include /usr/share/nginx/modules/*.conf; No dynamic modules in WebMonExt nor WebServices

events {
    worker_connections 6;
}

http {
    log_format  main  '[$time_local]($remote_addr) "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

#    access_log      off;
    access_log  /tmp/nginx/access.log  main;
    error_log       syslog:server=unix:/dev/log,tag=nginx,nohostname,severity=error;

    # Remove nginx version from header and error page
    server_tokens   off;

    client_max_body_size 30m;

    sendfile on;
    sendfile_max_chunk  0;
    tcp_nopush          on;
    tcp_nodelay         on;
    proxy_read_timeout  30;
    types_hash_max_size 2048;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # Load modular configuration files from the /etc/nginx/conf.d directory.
    # See http://nginx.org/en/docs/ngx_core_module.html#include
    # for more information.
    # include /etc/nginx/conf.d/*.conf; No modular configuration files in WebMonExt nor WebServices
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }


    # WebSocketFy
    #
    upstream websocket {
        server 127.0.0.1:3000;
    }

    # HTTP server
    #
    server {
            listen       8080 default;
            server_name  WebMonext;

        # include WebService HTTP locations
        # Above line shall be uncommented when WebService is integrated
        # include /usr/WebServers/WebService/nginx/nginx80.location;

        ## Redirige le HTTP vers le HTTPS ##
        location / {
            return 301 https://$http_host$request_uri;
        }
    }

    # HTTP server
    #
    server {
        listen      8443 ssl;           #Ecouter en IPV4
        server_name WebMonext;
        root        /usr/html/;
        index       index.html;

        # include WebMonExt HTTPS locations
        # Above line shall be uncommented when WebMonExt is integrated
        # include /usr/WebServers/WebMonExt/nginx/nginx443.location;

        # include WebService HTTPS locations
        # Above line shall be uncommented when WebService is integrated
        # include /usr/WebServers/WebService/nginx/nginx443.location;

        error_page 404 /404.html;
            location = /40x.html {
        }

        error_page 500 502 503 504 /50x.html;
            location = /50x.html {
        }

        ###########
        #   SSL   #
        ###########
        ## Certificates
        ssl_certificate     /etc/ssl/certificate/WebMonext_ECC.crt;
        ssl_certificate_key /etc/ssl/private/WebMonext_ECC.key;

        ## Protocol
        ssl_protocols           TLSv1.2;

#       ## Diffie-Hellman
#       ssl_dhparam             /etc/ssl/certificate/dhparam2048.pem;
#       ## ANSSI R7-Key exchanges:  secp256r1, secp384r1 or secp521r1
#       ssl_ecdh_curve         secp384r1;     #ClÃ© Elliptic curve DiffieâHellman
#
#       ## Ciphers
#       ##   Make the server choose the best cipher instead of the browser
#       ssl_prefer_server_ciphers  on;
#       ## ALSTOM STD0017 rev F configuration:
#       ##  TCMS_SyID_ETH_CYB_0035
#       ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!eNULL:!EXPORT:!CAMELLIA:!DES:!MD5:!PSK:!RC4:!SHA1; #Cipher Suite
#
#       ## TLS parameters
#       ssl_session_cache    shared:SSL:20m;
#       ssl_session_timeout  180m;
#       ssl_session_tickets on;
#
#       ## HSTS
#       add_header Strict-Transport-Security "max-age=15768000; includeSubDomains";
    }

}
